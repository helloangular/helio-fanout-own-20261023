name: helio redeploy pipeline-b4132cf0-7fdc-4261-86ea-02d3eb1f2047
'on':
  workflow_dispatch:
    inputs:
      helio_execution_id:
        type: string
        required: true
      environments:
        type: string
        required: true
        description: JSON list with exactly one manifest instance ID
      artifact_uri:
        type: string
        required: true
        description: Immutable artifact URI pinned to artifact_digest
      artifact_digest:
        type: string
        required: true
      workflow_revision:
        type: string
        required: true
        description: Finalized execution commit; must equal the commit this run executes
jobs:
  plan:
    runs-on:
    - self-hosted
    - helio-plan
    outputs:
      selected: ${{ steps.verify.outputs.selected }}
    steps:
    - uses: actions/checkout@v4
    - id: verify
      env:
        HELIO_MODE: redeploy
        HELIO_ENVIRONMENTS: ${{ inputs.environments }}
        HELIO_ARTIFACT_URI: ${{ inputs.artifact_uri }}
        HELIO_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        HELIO_WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        HELIO_MANIFEST: .helio/pipeline-b4132cf0-7fdc-4261-86ea-02d3eb1f2047/environments.json
        HELIO_ACTIVATION: .helio/pipeline-b4132cf0-7fdc-4261-86ea-02d3eb1f2047/activation.json
        HELIO_WORKFLOW: .github/workflows/helio-pipeline-b4132cf0-7fdc-4261-86ea-02d3eb1f2047-redeploy.yml
      run: node .helio/plan.cjs
  deploy-fown-prod-east:
    needs:
    - plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.selected), 'fown-prod-east') }}
    uses: ./.github/workflows/helio-pipeline-b4132cf0-7fdc-4261-86ea-02d3eb1f2047-deploy-one.yml
    with:
      env: fown-prod-east
      runs_on: '["ubuntu-latest"]'
      artifact_digest: ${{ inputs.artifact_digest }}
      artifact_uri: ${{ inputs.artifact_uri }}
      mode: redeploy
    secrets: inherit
  deploy-fown-prod-west:
    needs:
    - plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.selected), 'fown-prod-west') }}
    uses: ./.github/workflows/helio-pipeline-b4132cf0-7fdc-4261-86ea-02d3eb1f2047-deploy-one.yml
    with:
      env: fown-prod-west
      runs_on: '["ubuntu-latest"]'
      artifact_digest: ${{ inputs.artifact_digest }}
      artifact_uri: ${{ inputs.artifact_uri }}
      mode: redeploy
    secrets: inherit
